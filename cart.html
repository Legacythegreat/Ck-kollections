<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CK Collections - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f9f9f9;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background: #f4f4f4;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2em;
            font-family: 'Pacifico', cursive;
            color: #ff6600;
        }

        .cart {
            font-size: 1.5em;
            color: #333;
            cursor: pointer;
            position: relative;
        }

        .cart .cart-count {
            position: absolute;
            top: -5px;
            right: -10px;
            background: #ff6600;
            color: #fff;
            border-radius: 50%;
            padding: 5px 10px;
            font-size: 0.8em;
        }

        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100%;
            background: #fff;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
            transition: right 0.3s;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-modal.active {
            right: 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .cart-item button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        section {
            padding: 50px 10%;
            text-align: center;
        }

        .product {
            background: #fff;
            padding: 20px;
            margin: 20px auto;
            max-width: 300px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .product p {
            font-size: 1.2em;
            margin: 10px 0;
        }

        .product button {
            padding: 10px 20px;
            background: #ff6600;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .product button:hover {
            background: #e55c00;
        }
    </style>
    <script>
        const BACKEND_URL = "https://ck-kollection.onrender.com";
        
        function toggleCart() {
            document.querySelector('.cart-modal').classList.toggle('active');
        }

        function addToCart(name, price) {
            const userId = "testUser";
            fetch(`${BACKEND_URL}/cart`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId, name, price })
            }).then(() => updateCart());
        }

        function updateCart() {
            const userId = "testUser";
            fetch(`${BACKEND_URL}/cart/${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.querySelector('.cart-count').textContent = data.items.length;
                    const cartItemsContainer = document.querySelector('.cart-items');
                    cartItemsContainer.innerHTML = '';
                    data.items.forEach(item => {
                        const cartItem = document.createElement('div');
                        cartItem.classList.add('cart-item');
                        cartItem.innerHTML = `<p>${item.name} - $${item.price}</p> <button onclick="removeFromCart('${item.name}')">Remove</button>`;
                        cartItemsContainer.appendChild(cartItem);
                    });
                });
        }

        function removeFromCart(name) {
            const userId = "testUser";
            fetch(`${BACKEND_URL}/cart/remove`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId, name })
            }).then(() => updateCart());
        }

        updateCart();
    </script>
</head>
<body>
    <header>
        <h1>CK Collections</h1>
        <div class="cart" onclick="toggleCart()">
            🛒 <span class="cart-count">0</span>
        </div>
    </header>
    <section>
        <div class="product">
            <p>Traditional African Dress</p>
            <p>$50</p>
            <button onclick="addToCart('Traditional African Dress', 50)">Add to Cart</button>
        </div>
        <div class="product">
            <p>Ankara Shirt</p>
            <p>$30</p>
            <button onclick="addToCart('Ankara Shirt', 30)">Add to Cart</button>
        </div>
    </section>
    <div class="cart-modal">
        <h2>Your Cart</h2>
        <div class="cart-items"></div>
        <button onclick="toggleCart()">Close</button>
    </div>
</body>
</html>
