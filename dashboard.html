<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #ff6600;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #e55c00;
        }
        .product-list {
            margin-top: 20px;
        }
        img {
            max-width: 100px;
            display: block;
            margin: 10px auto;
        }
    </style>
</head>
<body>
    <div class="container" id="loginContainer">
        <h2>Admin Login</h2>
        <input type="text" id="adminUsername" placeholder="Username">
        <input type="password" id="adminPassword" placeholder="Password">
        <button onclick="adminLogin()">Login</button>
    </div>

    <div class="container" id="dashboardContainer" style="display: none;">
        <h2>Admin Dashboard</h2>
        <input type="text" id="productName" placeholder="Product Name">
        <input type="number" id="productPrice" placeholder="Price">
        <input type="file" id="productImage" accept="image/*">
        <button onclick="addProduct()">Add Product</button>
        <div class="product-list" id="productList"></div>
        <button onclick="logout()">Logout</button>
    </div>

    <script>
        const BACKEND_URL = "https://ck-kollection.onrender.com";
        const admins = {
            "dkendi1987@gmail.com": "neemakena",
            "enochtarsh@gmail.com": "tarsh6304"
        };

        function adminLogin() {
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            
            if (admins[username] && admins[username] === password) {
                localStorage.setItem("adminToken", username);
                showDashboard();
            } else {
                alert("Invalid credentials");
            }
        }

        function showDashboard() {
            document.getElementById("loginContainer").style.display = "none";
            document.getElementById("dashboardContainer").style.display = "block";
            loadProducts();
        }

        function addProduct() {
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const imageInput = document.getElementById('productImage');
            const imageFile = imageInput.files[0];
            const token = localStorage.getItem("adminToken");

            if (!token) {
                alert("Unauthorized access");
                return;
            }
            
            const formData = new FormData();
            formData.append('name', name);
            formData.append('price', price);
            formData.append('image', imageFile);
            
            fetch(`${BACKEND_URL}/products`, {
                method: "POST",
                body: formData
            }).then(response => response.json())
              .then(() => loadProducts());
        }

        function loadProducts() {
            fetch(`${BACKEND_URL}/products`)
                .then(response => response.json())
                .then(data => {
                    const productList = document.getElementById('productList');
                    productList.innerHTML = '';
                    data.forEach(product => {
                        productList.innerHTML += `<p>${product.name} - $${product.price} <img src="${product.image}" alt="Product Image"> <button onclick="deleteProduct('${product.id}')">Delete</button></p>`;
                    });
                });
        }

        function deleteProduct(id) {
            const token = localStorage.getItem("adminToken");
            fetch(`${BACKEND_URL}/products/${id}`, {
                method: "DELETE"
            }).then(() => loadProducts());
        }

        function logout() {
            localStorage.removeItem("adminToken");
            document.getElementById("dashboardContainer").style.display = "none";
            document.getElementById("loginContainer").style.display = "block";
        }
    </script>
</body>
</html>
