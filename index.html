<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CK Collections - Home</title>
    <script>
        const BACKEND_URL = "https://your-backend-url.onrender.com"; // Replace with actual backend link

        function addToCart(name, price) {
            const userId = "testUser"; // Replace with actual user system if needed
            fetch(`${BACKEND_URL}/cart`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId, name, price })
            }).then(() => updateCartCount());
        }

        function updateCartCount() {
            const userId = "testUser";
            fetch(`${BACKEND_URL}/cart/${userId}`)
                .then(res => res.json())
                .then(data => document.querySelector('.cart-count').textContent = data.items.length);
        }

        updateCartCount();
    </script>
</head>
<body>
    <header>
        <h1>CK Collections</h1>
        <div class="cart">
            <a href="cart.html">🛒 <span class="cart-count">0</span></a>
        </div>
    </header>
    <section>
        <div class="product">
            <p>Traditional African Dress</p>
            <p>$50</p>
            <button onclick="addToCart('Traditional African Dress', 50)">Add to Cart</button>
        </div>
        <div class="product">
            <p>Ankara Shirt</p>
            <p>$30</p>
            <button onclick="addToCart('Ankara Shirt', 30)">Add to Cart</button>
        </div>
    </section>
</body>
</html>
