<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CK Collections - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f9f9f9;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background: #f4f4f4;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2em;
            font-family: 'Pacifico', cursive;
            color: #ff6600;
        }

        .cart {
            font-size: 1.5em;
            color: #333;
            cursor: pointer;
            position: relative;
        }

        .cart .cart-count {
            position: absolute;
            top: -5px;
            right: -10px;
            background: #ff6600;
            color: #fff;
            border-radius: 50%;
            padding: 5px 10px;
            font-size: 0.8em;
        }

        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100%;
            background: #fff;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
            transition: right 0.3s;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-modal.active {
            right: 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .cart-item button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        section {
            padding: 50px 10%;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .product {
            background: #fff;
            padding: 20px;
            width: 300px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .product img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .product p {
            font-size: 1.2em;
            margin: 10px 0;
        }

        .product button {
            padding: 10px 20px;
            background: #ff6600;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .product button:hover {
            background: #e55c00;
        }

        .admin-link {
            margin: 20px;
            text-align: right;
        }

        .admin-link a {
            color: #ff6600;
            font-weight: bold;
            text-decoration: none;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        const BACKEND_URL = "https://ck-kollection.onrender.com";

        async function fetchProducts() {
            const response = await fetch(`${BACKEND_URL}/products`);
            const products = await response.json();
            const productContainer = document.querySelector('section');
            productContainer.innerHTML = '';
            products.forEach(product => {
                const productElement = document.createElement('div');
                productElement.classList.add('product');
                productElement.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <p>${product.name}</p>
                    <p>$${product.price}</p>
                    <button onclick="addToCart('${product.id}')">Add to Cart</button>
                `;
                productContainer.appendChild(productElement);
            });
        }

        function toggleCart() {
            document.querySelector('.cart-modal').classList.toggle('active');
        }

        function addToCart(productId) {
            const userId = "testUser";
            fetch(`${BACKEND_URL}/cart`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId, productId })
            }).then(() => updateCart());
        }

        fetchProducts();
    </script>
</head>
<body>
    <header>
        <h1>CK Collections</h1>
        <div class="cart" onclick="toggleCart()">🛒 <span class="cart-count">0</span></div>
    </header>
    <div class="admin-link">
        <a href="admin.html">Admin Dashboard</a>
    </div>
    <section></section>
    <div class="cart-modal">
        <h2>Your Cart</h2>
        <div class="cart-items"></div>
        <button onclick="toggleCart()">Close</button>
    </div>
</body>
</html>
