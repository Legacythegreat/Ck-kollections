<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CK Kollections - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f9f9f9;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background: #f4f4f4;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2em;
            font-family: 'Pacifico', cursive;
            color: #ff6600;
        }

        .cart {
            font-size: 1.5em;
            color: #333;
        }

        .cart a {
            text-decoration: none;
            color: inherit;
            position: relative;
        }

        .cart .cart-count {
            position: absolute;
            top: -5px;
            right: -10px;
            background: #ff6600;
            color: #fff;
            border-radius: 50%;
            padding: 5px 10px;
            font-size: 0.8em;
        }

        section {
            padding: 50px 10%;
            text-align: center;
        }

        .product {
            background: #fff;
            padding: 20px;
            margin: 20px auto;
            max-width: 300px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .product p {
            font-size: 1.2em;
            margin: 10px 0;
        }

        .product button {
            padding: 10px 20px;
            background: #ff6600;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .product button:hover {
            background: #e55c00;
        }
    </style>
    <script>
        const BACKEND_URL = "https://ck-kollection.onrender.com"; // Replace with actual backend link

        function addToCart(name, price) {
            const userId = "testUser"; // Replace with actual user system if needed
            fetch(`${BACKEND_URL}/cart`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userId, name, price })
            }).then(() => updateCartCount());
        }

        function updateCartCount() {
            const userId = "testUser";
            fetch(`${BACKEND_URL}/cart/${userId}`)
                .then(res => res.json())
                .then(data => document.querySelector('.cart-count').textContent = data.items.length);
        }

        updateCartCount();
    </script>
</head>
<body>
    <header>
        <h1>CK Kollections</h1>
        <div class="cart">
            <a href="cart.html">🛒 <span class="cart-count">0</span></a>
        </div>
    </header>
    <section>
        <div class="product">
            <p>Traditional African Dress</p>
            <p>$50</p>
            <button onclick="addToCart('Traditional African Dress', 50)">Add to Cart</button>
        </div>
        <div class="product">
            <p>Ankara Shirt</p>
            <p>$30</p>
            <button onclick="addToCart('Ankara Shirt', 30)">Add to Cart</button>
        </div>
    </section>
</body>
</html>
